<VirtualHost *:80>
    ServerName api.kaho.fr

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /v1/events http://127.0.0.1:8792/v1/events flushpackets=on timeout=3600
    ProxyPass / http://127.0.0.1:8792/
    ProxyPassReverse / http://127.0.0.1:8792/
    LimitRequestBody 1048576
    <Location /v1/events>
        SetEnv no-gzip 1
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/kahocord-badges-error.log
    CustomLog ${APACHE_LOG_DIR}/kahocord-badges-access.log combined
</VirtualHost>
